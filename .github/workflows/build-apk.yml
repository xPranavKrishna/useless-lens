name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo (custom app files)
        uses: actions/checkout@v4
        with:
          path: custom

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create fresh Flutter project scaffold
        run: flutter create useless_lens

      - name: Copy in custom app code
        run: |
          cp custom/pubspec.yaml useless_lens/pubspec.yaml
          cp custom/lib/main.dart useless_lens/lib/main.dart

      - name: Add camera permission to AndroidManifest
        working-directory: useless_lens
        run: |
          python3 - <<'EOF'
          import re
          path = "android/app/src/main/AndroidManifest.xml"
          with open(path) as f:
              content = f.read()
          perms = (
              '    <uses-permission android:name="android.permission.CAMERA"/>\n'
              '    <uses-feature android:name="android.hardware.camera" android:required="true"/>\n'
              '    <uses-feature android:name="android.hardware.camera.flash" android:required="false"/>\n'
          )
          if 'android.permission.CAMERA' not in content:
              content = re.sub(r'(<manifest[^>]*>)', r'\1\n' + perms, content, count=1)
              with open(path, "w") as f:
                  f.write(content)
          EOF

      - name: Force compileSdk/targetSdk to 35
        working-directory: useless_lens
        run: |
          python3 - <<'EOF'
          import re
          path = "android/app/build.gradle.kts"
          try:
              with open(path) as f:
                  content = f.read()
              content = re.sub(r'compileSdk\s*=\s*flutter\.compileSdkVersion', 'compileSdk = 35', content)
              content = re.sub(r'targetSdk\s*=\s*flutter\.targetSdkVersion', 'targetSdk = 35', content)
              with open(path, "w") as f:
                  f.write(content)
          except FileNotFoundError:
              path = "android/app/build.gradle"
              with open(path) as f:
                  content = f.read()
              content = re.sub(r'compileSdk(Version)?\s+flutter\.compileSdkVersion', 'compileSdk 35', content)
              content = re.sub(r'targetSdkVersion\s+flutter\.targetSdkVersion', 'targetSdkVersion 35', content)
              with open(path, "w") as f:
                  f.write(content)
          EOF

      - name: Get dependencies
        working-directory: useless_lens
        run: flutter pub get

      - name: Build release APK
        working-directory: useless_lens
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: useless-lens-apk
          path: useless_lens/build/app/outputs/flutter-apk/app-release.apk
          
